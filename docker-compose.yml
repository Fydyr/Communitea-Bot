services:
  app:
    container_name: ${NAME}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_URL: https://github.com/Fydyr/discord-bot.git
        GIT_BRANCH: main
    networks:
      - lan
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OWNER_ID: "${OWNER_ID}"
      DISCORD_TOKEN: "${DISCORD_TOKEN}"
      STATUS_CHANNEL_ID: "${STATUS_CHANNEL_ID}"
      LOG_WEBHOOK_URL: "${LOG_WEBHOOK_URL}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      NODE_ENV: production

  postgres:
    image: postgres:17-alpine
    container_name: ${NAME}-postgres
    networks:
      - lan
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  lan:
    external: false
    name: lan_${NAME}
